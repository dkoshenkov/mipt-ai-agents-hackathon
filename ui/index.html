<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документы закупки</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section class="upload" aria-labelledby="documents-title">
      <h1 id="documents-title">Добавьте документы</h1>
      <div class="dropzone" id="dropzone">
        <input id="file-input" type="file" accept=".docx,.pdf" multiple aria-describedby="file-format">
        <label for="file-input" class="button">Выбрать файлы</label>
        <div><span>или перетащите их сюда</span><small id="file-format">DOCX или PDF, до 20 МиБ каждый</small></div>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div id="file-list"></div>
      <p class="status" role="status"></p>
      <button id="convert" class="primary" hidden>Подготовить документы</button>
      <div id="review-actions" hidden>
        <label class="consent"><input type="checkbox" id="public"> Все документы публичные. Разрешаю передать их текст внешним провайдерам.</label>
        <button id="review" class="primary" disabled>Проверить документы</button>
      </div>
    </section>
    <section id="report" aria-labelledby="report-title" hidden></section>
  </main>
</body>
</html>
